<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Rift RS</title>
    <link rel="preload" as="fetch" href="/game/chrome_rift_bg.wasm" crossorigin="anonymous">
    <link rel="preload" as="script" href="/game/chrome_rift.js" crossorigin="anonymous">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #070b16;
      }
      /* Bevy creates its own canvas; make it fill the page. */
      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cfe6ff;
        font: 16px/1.5 system-ui, sans-serif;
        letter-spacing: 0.04em;
        background: radial-gradient(circle at 50% 40%, #1a2540, #070b16);
      }
      #loading.hidden {
        display: none;
      }
      #loading .bar {
        width: 240px;
        height: 4px;
        margin: 14px auto 0;
        background: #223055;
        border-radius: 2px;
        overflow: hidden;
      }
      #loading .bar i {
        display: block;
        height: 100%;
        width: 35%;
        background: #5fd0ff;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          margin-left: -35%;
        }
        100% {
          margin-left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div style="text-align: center">
        <div>CHROME RIFT RS</div>
        <div class="bar"><i></i></div>
        <div style="opacity: 0.6; margin-top: 10px; font-size: 13px">loading…</div>
      </div>
    </div>
    <script type="module">
      import init from "./chrome_rift.js";
      const loading = document.getElementById("loading");
      try {
        await init();
        loading.classList.add("hidden");
      } catch (err) {
        loading.innerHTML =
          '<div style="max-width: 32rem; text-align: center; color: #ff9aa2">' +
          "Failed to start. This build needs WebGL2.<br><br>" +
          String(err) +
          "</div>";
        console.error(err);
      }
    </script>
  </body>
</html>
